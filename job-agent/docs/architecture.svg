<svg width="680" height="878" viewBox="0 0 680 878" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Job Application Agent architecture</title>
<desc>A vertical pipeline of LangGraph nodes: job boards feed ingest and score, then tailor and validate, then a human approval gate, then rendering the resume to a file, then assisted apply, then a second approval gate, then contacts and outreach, then a third approval gate, ending in a tracker. Anthropic API and a profile store support the pipeline on the sides, Apollo API feeds contacts, and a Streamlit UI is where the human approves each gate.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="878" fill="#FFFFFF"/>

<!-- legend -->
<rect x="40" y="44" width="12" height="12" rx="2" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="58" y="53" font-family="Arial, sans-serif" font-size="12" fill="#444441">human checkpoint</text>
<rect x="186" y="44" width="12" height="12" rx="2" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
<text x="204" y="53" font-family="Arial, sans-serif" font-size="12" fill="#444441">agent step</text>
<rect x="287" y="44" width="12" height="12" rx="2" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
<text x="305" y="53" font-family="Arial, sans-serif" font-size="12" fill="#444441">data store</text>
<rect x="388" y="44" width="12" height="12" rx="2" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/>
<text x="406" y="53" font-family="Arial, sans-serif" font-size="12" fill="#444441">external service</text>

<!-- main pipeline arrows -->
<line x1="340" y1="136" x2="340" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="222" x2="340" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="308" x2="340" y2="338" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="374" x2="340" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="456" x2="340" y2="490" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="546" x2="340" y2="576" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="612" x2="340" y2="638" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="694" x2="340" y2="720" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="756" x2="340" y2="782" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- side arrows -->
<line x1="190" y1="280" x2="210" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="190" y1="668" x2="210" y2="668" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="206" x2="470" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="230" x2="470" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- streamlit leaders to gates -->
<line x1="490" y1="604" x2="470" y2="356" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<line x1="490" y1="604" x2="470" y2="594" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<line x1="490" y1="604" x2="470" y2="738" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

<!-- 1 Job boards -->
<rect x="210" y="80" width="260" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Job boards</text>
<text x="340" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Greenhouse, Lever, Ashby APIs</text>

<!-- 2 Ingest & score -->
<rect x="210" y="166" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Ingest &amp; score</text>
<text x="340" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Rank jobs against your profile</text>

<!-- 3 Tailor & validate -->
<rect x="210" y="252" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Tailor &amp; validate</text>
<text x="340" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Rewrite, then verify each claim</text>

<!-- gate 1 -->
<rect x="210" y="338" width="260" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Approve: resume &amp; letter</text>

<!-- 4 Render docs -->
<rect x="210" y="400" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Render docs</text>
<text x="340" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Resume and letter to DOCX</text>

<!-- 5 Assisted apply -->
<rect x="210" y="490" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Assisted apply</text>
<text x="340" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Playwright fills the form</text>

<!-- gate 2 -->
<rect x="210" y="576" width="260" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Approve: before it submits</text>

<!-- 7 Contacts & outreach -->
<rect x="210" y="638" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Contacts &amp; outreach</text>
<text x="340" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Find people, draft short notes</text>

<!-- gate 3 -->
<rect x="210" y="720" width="260" height="36" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Approve: each message</text>

<!-- 9 Tracker -->
<rect x="210" y="782" width="260" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Tracker</text>
<text x="340" y="822" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Status, files, follow-up dates</text>

<!-- A Profile store -->
<rect x="40" y="254" width="150" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Profile store</text>
<text x="115" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Facts, indexed</text>

<!-- B Apollo API -->
<rect x="40" y="642" width="150" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="115" y="664" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Apollo API</text>
<text x="115" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Finds contacts</text>

<!-- C Anthropic API -->
<rect x="490" y="190" width="150" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Anthropic API</text>
<text x="565" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Scoring &amp; writing</text>

<!-- D Streamlit UI -->
<rect x="490" y="576" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="565" y="599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Streamlit UI</text>
<text x="565" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">Review &amp; approve</text>

</svg>
