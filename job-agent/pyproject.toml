[project]
name = "job-agent"
version = "0.1.0"
description = "LangGraph agent that finds, tailors for, and helps apply to jobs, with human approval before every irreversible step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-anthropic>=0.4.0",
    "chromadb>=0.5.0",
    "httpx>=0.28.0",
    "playwright>=1.48.0",
    "python-docx>=1.1.2",
    "docx2pdf>=0.1.8",
    "streamlit>=1.40.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
