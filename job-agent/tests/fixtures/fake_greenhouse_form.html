<!doctype html>
<html>
<head><title>Fake Greenhouse application form</title></head>
<body>
  <form>
    <label for="first_name">First name</label>
    <input id="first_name" name="job_application[first_name]" type="text" />

    <label for="last_name">Last name</label>
    <input id="last_name" name="job_application[last_name]" type="text" />

    <label for="email">Email</label>
    <input id="email" name="job_application[email]" type="text" />

    <label for="phone">Phone</label>
    <input id="phone" name="job_application[phone]" type="text" />

    <label for="resume">Resume</label>
    <input id="resume" name="job_application[resume]" type="file" />

    <label for="why_interested">Why are you interested in this role?</label>
    <textarea id="why_interested" name="job_application[why_interested]"></textarea>

    <button type="submit" id="submit_app">Submit application</button>
  </form>
</body>
</html>
